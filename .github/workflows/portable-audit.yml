name: Portable audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile maintenance scripts
        run: python3 -m compileall -q scripts

      - name: Check ystack public branding
        run: python3 scripts/check_branding.py

      - name: Check mirrors without rewriting the checkout
        run: python3 scripts/sync_mirrors.py --check

      - name: Strict repository portability audit
        run: python3 scripts/audit_portability.py --strict

      - name: Check markdown relative links
        run: python3 scripts/check_markdown_links.py

      - name: Validate model override fixtures
        run: |
          python3 scripts/validate_model_override.py scripts/fixtures/model-override/valid.json
          python3 scripts/validate_model_override.py scripts/fixtures/model-override/valid.md
          ! python3 scripts/validate_model_override.py scripts/fixtures/model-override/invalid-empty-roles.json
          ! python3 scripts/validate_model_override.py scripts/fixtures/model-override/invalid-schema-version.json
          ! python3 scripts/validate_model_override.py scripts/fixtures/model-override/invalid-label-format.md

      - name: Check import idempotency without touching workspace
        run: python3 scripts/port_to_portable.py --check-idempotent

      - name: Validate upstream manifest shape
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          data = json.loads(Path("UPSTREAM_MANIFEST.json").read_text())
          commit = data["upstream"].get("commit")
          assert commit, "upstream.commit missing"
          if commit != "UNPINNED" and not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit(f"upstream.commit must be UNPINNED or a 40-char SHA, got {commit!r}")
          print(f"upstream.commit={commit}")
          PY

      - name: Report changed-file portability scan on pull requests
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/audit_portability.py
          --strict
          --changed-from "${{ github.event.pull_request.base.sha }}"
